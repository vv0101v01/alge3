name: CI

on:
  push:
    branches: [e124, main]
  pull_request:
    branches: [e124, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fmt / check / test / bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit (latest stable)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          moon version --all
          moonc -v

      - name: Format check
        run: moon fmt --check

      - name: Check (wasm, warnings denied)
        run: moon check --target wasm --deny-warn

      - name: Check (native, warnings denied)
        run: moon check --target native --deny-warn

      - name: Test (wasm)
        run: moon test --target wasm

      - name: Test (native)
        run: moon test --target native

      - name: Bench smoke run (native)
        run: moon run --target native bench
