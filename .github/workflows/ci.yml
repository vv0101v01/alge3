name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: moon test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, native]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          moon version --all

      - name: Format check
        if: matrix.target == 'wasm'
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::moon fmt produced changes; run 'moon fmt' locally" && exit 1)

      - name: Test
        run: moon test --target ${{ matrix.target }}

  bench:
    name: bench (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Run benchmarks
        run: moon run --target native bench
